name: Build MD Reader package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "value=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          mkdir -p build/stage
          cp -r manifest.json background.js content.js content.css shared.js lib popup reader README.md build/stage/
          cd build/stage
          zip -r "../md-reader-${{ steps.version.outputs.value }}.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-reader
          path: build/*.zip

      - name: Attach build to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
